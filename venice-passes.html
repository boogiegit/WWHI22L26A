<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<title>Find Your Venice Access Pass</title>
<style>
:root { --bg:#f8f8f6; --card:#fff; --text:#111110; --mid:#676767; --dim:#a6a6a6; --rule:rgba(0,0,0,.1); --blue:#0a84ff; --green:#1f9d55; --red:#ce1126; --gold:#9a7b2e; --safe-top:env(safe-area-inset-top,0px); }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#fff; --mid:rgba(235,235,245,.65); --rule:rgba(84,84,88,.65); --blue:#2997ff; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:760px; margin:0 auto; padding:calc(var(--safe-top) + 14px) 12px 28px; }
.top { display:flex; align-items:center; gap:12px; margin:0 -12px 18px; padding:12px 14px 14px; background:var(--card); border-bottom:1px solid var(--rule); border-top:3px solid var(--red); }
.back { color:var(--red); text-decoration:none; font-weight:900; font-size:14px; }
.top-title { font-size:20px; font-weight:900; letter-spacing:-.03em; }
.card { background:var(--card); border:1px solid var(--rule); border-radius:0; padding:18px; box-shadow:0 16px 34px rgba(0,0,0,.04); border-top:3px solid var(--blue); }
.kicker { color:var(--blue); font-size:11px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; margin-bottom:8px; }
h1 { font-family:Georgia,'Times New Roman',serif; font-size:30px; line-height:1.05; margin:0 0 10px; }
p { color:var(--mid); line-height:1.65; margin:0 0 16px; }
.search { display:grid; gap:10px; margin:16px 0 12px; }
input { width:100%; min-height:56px; border:1px solid var(--rule); border-radius:0; background:var(--bg); color:var(--text); font:inherit; font-size:17px; padding:12px 14px; outline:none; }
input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(10,132,255,.16); }
button,.button { display:inline-flex; justify-content:center; align-items:center; min-height:48px; padding:12px 16px; border:0; border-radius:0; background:var(--blue); color:#fff; font-weight:900; letter-spacing:.08em; text-transform:uppercase; text-decoration:none; cursor:pointer; }
.btn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.clear-btn { background:var(--bg); color:var(--text); border:1px solid var(--rule); }
.results { display:grid; gap:10px; margin-top:16px; }
.result { border:1px solid var(--rule); background:var(--card); border-radius:16px; padding:14px; display:grid; gap:8px; }
.result strong { font-size:17px; }
.meta { color:var(--mid); font-size:13px; }
.warn { color:var(--red); font-weight:800; }
.pass { display:none; margin-top:16px; }
.pass.show { display:block; }
.pass-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 10px; flex-wrap:wrap; }
.pass-title { font-weight:900; }
iframe { width:100%; height:min(76vh,720px); border:1px solid var(--rule); border-radius:18px; background:#fff; }
.small { font-size:12px; color:var(--mid); margin-top:10px; }
.empty { border:1px dashed var(--rule); border-radius:16px; padding:18px; color:var(--mid); line-height:1.6; }
.pass-list { margin-top:18px; border:1px solid var(--rule); background:var(--card); }
.pass-list-head { padding:12px 16px; border-bottom:1px solid var(--rule); color:var(--gold); font-size:13px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
.pass-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--rule); }
.pass-row:last-child { border-bottom:none; }
.pass-row-name { font-size:18px; font-weight:900; letter-spacing:-.02em; }
.pass-row-code { margin-top:5px; color:var(--blue); font-size:13px; font-weight:900; letter-spacing:.14em; }
.pass-open { background:var(--bg); border:1px solid var(--rule); color:var(--text); min-height:44px; padding:10px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="./app.html">‹ Back</a><div class="top-title">Venice Access Pass</div></div>
  <section class="card">
    <div class="kicker">Venice Access Pass</div>
    <h1>Find Your Venice Access Pass</h1>
    <p>Type your first name, surname, or full name. If more than one guest matches, tap your own name.</p>
    <div class="search">
      <input id="q" type="search" autocomplete="name" placeholder="Type your name" aria-label="Type your name">
      <div class="btn-row"><button type="button" id="searchBtn">Find Pass</button><button class="clear-btn" type="button" id="clearBtn">Clear</button></div>
    </div>
    <div id="results" class="results"></div>
    <div id="pass" class="pass">
      <div class="pass-head">
        <div><div class="pass-title" id="passName"></div><div class="meta" id="passCode"></div></div>
        <a class="button" id="openPass" href="#" target="_blank" rel="noopener">Open QR Code</a>
      </div>
      <iframe id="passFrame" title="Venice access pass QR code"></iframe>
      <div class="small">Show this QR code with photo ID if requested in Venice.</div>
    </div>
    <div id="passList" class="pass-list"></div>
  </section>
</div>
<script>
function safeText(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function validateTickets(items) {
  if (!Array.isArray(items)) throw new Error('Invalid ticket list');
  return items.map(item => {
    const file = String(item.file || '');
    if (file && (!file.startsWith("venice-passes/") || file.includes('..') || !/\.pdf$/i.test(file))) throw new Error('Invalid ticket path');
    return { ...item, file, name: String(item.name || ''), first: String(item.first || ''), last: String(item.last || ''), code: String(item.code || '') };
  });
}

let PASSES = [];
const q = document.getElementById('q');
const results = document.getElementById('results');
const pass = document.getElementById('pass');
const passName = document.getElementById('passName');
const passCode = document.getElementById('passCode');
const passFrame = document.getElementById('passFrame');
const openPass = document.getElementById('openPass');
const passList = document.getElementById('passList');
function norm(value) { return String(value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function showPass(item) {
  passName.textContent = item.name;
  passCode.textContent = `Voucher code: ${safeText(item.code)}`;
  if (!item.file) {
    pass.classList.remove('show');
    results.innerHTML = `<div class="empty"><strong>${safeText(item.name)}</strong><br><span class="warn">The name is in the CDA list, but its QR pass page was not included in the uploaded QR PDF. Please ask Brendon to check this voucher.</span></div>`;
    return;
  }
  passFrame.src = `${item.file}#toolbar=0&navpanes=0&view=FitH`;
  openPass.href = item.file;
  pass.classList.add('show');
  pass.scrollIntoView({ behavior:'smooth', block:'start' });
}
function sortedPasses() {
  return [...PASSES].sort((a,b) => a.last.localeCompare(b.last) || a.first.localeCompare(b.first) || a.code.localeCompare(b.code));
}
function renderPassList(items = sortedPasses()) {
  passList.innerHTML = `<div class="pass-list-head">${items.length} passes available</div>${items.map((item, index) => `
    <div class="pass-row">
      <div><div class="pass-row-name">${safeText(item.name)}</div><div class="pass-row-code">${safeText(item.code)}${item.file ? '' : ' · QR missing'}</div></div>
      <button class="pass-open" type="button" data-list-index="${index}">Open →</button>
    </div>`).join('') || '<div class="empty">No matching passes.</div>'}`;
  [...passList.querySelectorAll('[data-list-index]')].forEach(btn => btn.addEventListener('click', () => showPass(items[Number(btn.dataset.listIndex)])));
}
function render(matches) {
  pass.classList.remove('show');
  passFrame.removeAttribute('src');
  if (!matches.length) {
    results.innerHTML = '<div class="empty">No pass found. Try first name and surname together, or ask Brendon to check the spelling.</div>';
    return;
  }
  if (matches.length === 1) { showPass(matches[0]); results.innerHTML = ''; return; }
  results.innerHTML = matches.map((item, index) => `<button class="result" type="button" data-index="${index}"><strong>${safeText(item.name)}</strong><span class="meta">Voucher code: ${safeText(item.code)}</span>${item.file ? '' : '<span class="warn">QR file missing</span>'}</button>`).join('');
  [...results.querySelectorAll('[data-index]')].forEach(btn => btn.addEventListener('click', () => showPass(matches[Number(btn.dataset.index)])));
}
function search() {
  const term = norm(q.value);
  if (!term || term.length < 2) {
    results.innerHTML = '<div class="empty">Please type at least two letters of your name, or scroll the list below.</div>';
    pass.classList.remove('show');
    renderPassList();
    return;
  }
  const parts = term.split(' ').filter(Boolean);
  const matches = PASSES.filter(item => {
    const full = norm(item.name);
    const first = norm(item.first);
    const last = norm(item.last);
    return parts.every(part => full.includes(part) || first.includes(part) || last.includes(part));
  }).sort((a,b) => a.last.localeCompare(b.last) || a.first.localeCompare(b.first));
  render(matches);
  renderPassList(matches);
}
document.getElementById('searchBtn').addEventListener('click', search);
document.getElementById('clearBtn').addEventListener('click', () => {
  q.value = '';
  results.innerHTML = '<div class="empty">Type your full first and last name, or scroll the list below and tap Open.</div>';
  pass.classList.remove('show');
  passFrame.removeAttribute('src');
  renderPassList();
});
q.addEventListener('keydown', event => { if (event.key === 'Enter') search(); });
q.addEventListener('input', () => {
  const term = norm(q.value);
  if (term.length >= 2) search();
  if (!term) {
    results.innerHTML = '<div class="empty">Type your full first and last name, or scroll the list below and tap Open.</div>';
    renderPassList();
  }
});
fetch('./venice-passes/index.json', { cache: 'no-store', credentials: 'same-origin' })
  .then(response => { if (!response.ok) throw new Error('unavailable'); return response.json(); })
  .then(items => { PASSES = validateTickets(items); renderPassList(); q.focus(); })
  .catch(() => { results.textContent = 'Passes are unavailable. Sign in through the main app or ask your travel director for access.'; });
</script>
</body>
</html>
