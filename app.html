function loadTourRegistry() {
  if (location.protocol === "file:") return Promise.resolve(fallbackTourRegistry());
  return fetch(TOUR_REGISTRY_URL, { cache: "no-store" })
    .then((response) => {
      if (!response.ok) throw new Error("Tour registry unavailable");
      return response.json();
    })
    .catch(() => fallbackTourRegistry());
}

function loadTourData() {
  return loadPackagedTourData().catch((packageError) => {
    if (packageError?.fatalPackageError) throw packageError;
    return loadLegacyTourData(packageError);
  });
}

function legacyTourDataUrls() {
  return currentTourConfig?.dataUrls || [
    "./tour-data.json?v=154",
    "./data/tour-data.json?v=154",
    "./tour-data.json",
    "./data/tour-data.json"
  ];
}

function tourPackageManifestUrl() {
  return currentTourConfig?.packageUrl || `./tours/${encodeURIComponent(tourCode())}/tour.json`;
}

function packageBaseUrl(manifestUrl) {
  const index = manifestUrl.lastIndexOf("/");
  return index >= 0 ? manifestUrl.slice(0, index + 1) : "./";
}

function packageFileUrl(manifestUrl, filePath) {
  const raw = String(filePath || "").trim();
  if (!raw) return "";
  if (/^(https?:)?\/\//i.test(raw) || raw.startsWith("/") || raw.startsWith("./") || raw.startsWith("../")) {
    return new URL(raw, new URL(manifestUrl, location.href)).href;
  }
  return new URL(raw, new URL(packageBaseUrl(manifestUrl), location.href)).href;
}

function packageValidationError(message) {
  const error = new Error(message);
  error.fatalPackageError = true;
  return error;
}

function validateTourPackageManifest(manifest, manifestUrl) {
  if (!manifest || typeof manifest !== "object" || Array.isArray(manifest)) {
    throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Expected a JSON object.`);
  }
  const expectedCode = tourCode();
  if (!manifest.code) {
    throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Missing required field "code".`);
  }
  if (normalizeTourCode(manifest.code) !== expectedCode) {
    throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Expected code "${expectedCode}" but found "${manifest.code}".`);
  }
  if (!manifest.displayName) {
    throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Missing required field "displayName".`);
  }
  if (!manifest.dataFiles || typeof manifest.dataFiles !== "object" || Array.isArray(manifest.dataFiles)) {
    throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Missing required field "dataFiles".`);
  }
  if (!manifest.dataFiles.main && !manifest.dataFiles.base) {
    throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Missing required field "dataFiles.base".`);
  }
  if (!manifest.dataFiles.main) {
    ["itinerary", "hotels", "experiences", "resources", "branding", "features"].forEach((field) => {
      if (!manifest.dataFiles[field]) {
        throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Missing required field "dataFiles.${field}".`);
      }
    });
  }
  return manifest;
}

function validateLoadedTourData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid tour data at ${dataUrl}. Expected a JSON object.`);
  }
  if (!data.meta || typeof data.meta !== "object") {
    throw packageValidationError(`Invalid tour data at ${dataUrl}. Missing required field "meta".`);
  }
  if (!data.meta.slug) {
    throw packageValidationError(`Invalid tour data at ${dataUrl}. Missing required field "meta.slug".`);
  }
  if (!data.meta.name) {
    throw packageValidationError(`Invalid tour data at ${dataUrl}. Missing required field "meta.name".`);
  }
  if (!Array.isArray(data.days)) {
    throw packageValidationError(`Invalid tour data at ${dataUrl}. Missing required array "days".`);
  }
  if (!Array.isArray(data.hotels)) {
    throw packageValidationError(`Invalid tour data at ${dataUrl}. Missing required array "hotels".`);
  }
  return data;
}

function validateBaseTourData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid base tour data at ${dataUrl}. Expected a JSON object.`);
  }
  if (!data.meta || typeof data.meta !== "object") {
    throw packageValidationError(`Invalid base tour data at ${dataUrl}. Missing required field "meta".`);
  }
  if (!data.hostDefaults || typeof data.hostDefaults !== "object" || Array.isArray(data.hostDefaults)) {
    throw packageValidationError(`Invalid base tour data at ${dataUrl}. Missing required object "hostDefaults".`);
  }
  if (!data.contacts || typeof data.contacts !== "object" || Array.isArray(data.contacts)) {
    throw packageValidationError(`Invalid base tour data at ${dataUrl}. Missing required object "contacts".`);
  }
  if (!data.tools || typeof data.tools !== "object" || Array.isArray(data.tools)) {
    throw packageValidationError(`Invalid base tour data at ${dataUrl}. Missing required object "tools".`);
  }
  return data;
}

function validateItineraryData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid itinerary data at ${dataUrl}. Expected a JSON object.`);
  }
  if (!Array.isArray(data.days)) {
    throw packageValidationError(`Invalid itinerary data at ${dataUrl}. Missing required array "days".`);
  }
  data.days.forEach((day, index) => {
    if (!day || typeof day !== "object" || Array.isArray(day)) {
      throw packageValidationError(`Invalid itinerary data at ${dataUrl}. Expected days[${index}] to be an object.`);
    }
    if (day.number == null) {
      throw packageValidationError(`Invalid itinerary data at ${dataUrl}. Missing required field "days[${index}].number".`);
    }
    if (!Array.isArray(day.schedule)) {
      throw packageValidationError(`Invalid itinerary data at ${dataUrl}. Missing required array "days[${index}].schedule".`);
    }
  });
  return data;
}

function validateHotelsData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid hotels data at ${dataUrl}. Expected a JSON object.`);
  }
  if (!Array.isArray(data.hotels)) {
    throw packageValidationError(`Invalid hotels data at ${dataUrl}. Missing required array "hotels".`);
  }
  if (!data.hotels.length) {
    throw packageValidationError(`Invalid hotels data at ${dataUrl}. Expected at least one hotel.`);
  }
  data.hotels.forEach((hotel, index) => {
    if (!hotel || typeof hotel !== "object" || Array.isArray(hotel)) {
      throw packageValidationError(`Invalid hotels data at ${dataUrl}. Expected hotels[${index}] to be an object.`);
    }
    if (!hotel.id) {
      throw packageValidationError(`Invalid hotels data at ${dataUrl}. Missing required field "hotels[${index}].id".`);
    }
  });
  return data;
}

function validateExperiencesData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid experiences data at ${dataUrl}. Expected a JSON object.`);
  }
  if (!Array.isArray(data.days)) {
    throw packageValidationError(`Invalid experiences data at ${dataUrl}. Missing required array "days".`);
  }
  data.days.forEach((day, index) => {
    if (!day || typeof day !== "object" || Array.isArray(day)) {
      throw packageValidationError(`Invalid experiences data at ${dataUrl}. Expected days[${index}] to be an object.`);
    }
    if (day.number == null) {
      throw packageValidationError(`Invalid experiences data at ${dataUrl}. Missing required field "days[${index}].number".`);
    }
    if (!Array.isArray(day.optionals)) {
      throw packageValidationError(`Invalid experiences data at ${dataUrl}. Missing required array "days[${index}].optionals".`);
    }
  });
  return data;
}

function validateResourcesData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid resources data at ${dataUrl}. Expected a JSON object.`);
  }
  if (!data.sourceDocuments || typeof data.sourceDocuments !== "object" || Array.isArray(data.sourceDocuments)) {
    throw packageValidationError(`Invalid resources data at ${dataUrl}. Missing required object "sourceDocuments".`);
  }
  if (!data.sourceRules || typeof data.sourceRules !== "object" || Array.isArray(data.sourceRules)) {
    throw packageValidationError(`Invalid resources data at ${dataUrl}. Missing required object "sourceRules".`);
  }
  if (!data.tools || typeof data.tools !== "object" || Array.isArray(data.tools)) {
    throw packageValidationError(`Invalid resources data at ${dataUrl}. Missing required object "tools".`);
  }
  if (!data.tools.dayResources || typeof data.tools.dayResources !== "object" || Array.isArray(data.tools.dayResources)) {
    throw packageValidationError(`Invalid resources data at ${dataUrl}. Missing required object "tools.dayResources".`);
  }
  return data;
}

function validateBrandingData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid branding data at ${dataUrl}. Expected a JSON object.`);
  }
  ["tourCode", "slug", "name", "displayName", "shortName", "brand", "operatorLabel", "applicationTitle", "versionDisplay"].forEach((field) => {
    if (typeof data[field] !== "string" || !data[field].trim()) {
      throw packageValidationError(`Invalid branding data at ${dataUrl}. Missing required string "${field}".`);
    }
  });
  if (normalizeTourCode(data.tourCode) !== tourCode()) {
    throw packageValidationError(`Invalid branding data at ${dataUrl}. Expected tourCode "${tourCode()}" but found "${data.tourCode}".`);
  }
  if (data.year != null && !Number.isFinite(Number(data.year))) {
    throw packageValidationError(`Invalid branding data at ${dataUrl}. Expected "year" to be a number.`);
  }
  return data;
}

function validateFeatureGroup(data, dataUrl, groupName, allowedKeys) {
  if (!data[groupName] || typeof data[groupName] !== "object" || Array.isArray(data[groupName])) {
    throw packageValidationError(`Invalid features data at ${dataUrl}. Missing required object "${groupName}".`);
  }
  Object.keys(data[groupName]).forEach((key) => {
    if (!allowedKeys.includes(key)) {
      throw packageValidationError(`Invalid features data at ${dataUrl}. Unrecognised feature "${groupName}.${key}".`);
    }
    if (typeof data[groupName][key] !== "boolean") {
      throw packageValidationError(`Invalid features data at ${dataUrl}. Expected "${groupName}.${key}" to be true or false.`);
    }
  });
}

function validateFeaturesData(data, dataUrl) {
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw packageValidationError(`Invalid features data at ${dataUrl}. Expected a JSON object.`);
  }
  validateFeatureGroup(data, dataUrl, "runtime", ["shoppingTab", "travelImpactTab"]);
  validateFeatureGroup(data, dataUrl, "capabilities", [
    "experiences",
    "resources",
    "travelImpact",
    "weather",
    "cityGuides",
    "maps",
    "tickets",
    "menus",
    "optionalExperiences",
    "contacts",
    "seatingPlans",
    "uploads",
    "adminContentOverrides"
  ]);
  return data;
}

function assembleTourPackageMeta(baseMeta, branding, features) {
  const meta = {
    slug: branding.slug,
    name: branding.name,
    year: branding.year,
    brand: branding.brand,
    brandProfileId: branding.brandProfileId || "",
    brandAssets: branding.brandAssets || {},
    brandTheme: branding.brandTheme || {},
    operatorLabel: branding.operatorLabel,
    startDate: baseMeta.startDate,
    dayCount: baseMeta.dayCount,
    countries: baseMeta.countries,
    features: features.runtime,
    capabilities: features.capabilities || {}
  };
  Object.keys(baseMeta || {}).forEach((key) => {
    if (!(key in meta)) meta[key] = baseMeta[key];
  });
  return meta;
}

function normaliseBrandProfileId(value = "") {
  const text = String(value || "").trim().toLowerCase();
  if (!text) return "";
  if (text.includes("costsaver") || text.includes("cost saver")) return "costsaver";
  if (text.includes("insight")) return "insight";
  if (text.includes("trafalgar")) return "trafalgar";
  return text.replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

async function loadBrandProfiles() {
  const response = await fetch(BRAND_PROFILES_URL, { cache: "no-store" });
  if (!response.ok) return {};
  const data = await response.json();
  return data?.profiles && typeof data.profiles === "object" ? data.profiles : {};
}

function applyBrandProfileToBranding(branding, brandProfiles = {}) {
  const profileId = normaliseBrandProfileId(branding.brandProfileId || branding.brand);
  const profile = brandProfiles[profileId];
  if (!profile) return branding;
  const colours = profile.colours || {};
  return {
    ...branding,
    brand: profile.guestFacingName || branding.brand,
    operatorLabel: profile.sharedWording?.operatorLabel || branding.operatorLabel,
    applicationTitle: `${profile.app?.titlePrefix || profile.displayName || branding.brand} · ${branding.displayName}`,
    brandProfileId: profile.id || profileId,
    brandAssets: {
      ...(branding.brandAssets || {}),
      logoAsset: profile.logoAsset || branding.brandAssets?.logoAsset || "",
      icon192: profile.app?.icon192 || branding.brandAssets?.icon192 || "",
      icon512: profile.app?.icon512 || branding.brandAssets?.icon512 || ""
    },
    brandTheme: {
      primary: colours.primary || branding.brandTheme?.primary || "",
      secondary: colours.secondary || branding.brandTheme?.secondary || "",
      accent: colours.accent || branding.brandTheme?.accent || "",
      background: colours.background || branding.brandTheme?.background || "",
      surface: colours.surface || branding.brandTheme?.surface || "",
      text: colours.text || branding.brandTheme?.text || "",
      themeColor: profile.app?.themeColor || branding.brandTheme?.themeColor || ""
    }
  };
}

function applyBrandTheme() {
  const theme = tour?.meta?.brandTheme || {};
  const root = document.documentElement;
  document.body.dataset.brandProfile = normaliseBrandProfileId(tour?.meta?.brandProfileId || tour?.meta?.brand || "");
  const mappings = {
    primary: "--red",
    accent: "--gold",
    secondary: "--text",
    background: "--bg",
    surface: "--card",
    text: "--text"
  };
  Object.entries(mappings).forEach(([key, variable]) => {
    const value = theme[key];
    if (typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value)) root.style.setProperty(variable, value);
  });
  if (typeof theme.surface === "string" && /^#[0-9a-f]{6}$/i.test(theme.surface)) {
    root.style.setProperty("--surface", theme.surface);
  }
  if (typeof theme.primary === "string" && /^#[0-9a-f]{6}$/i.test(theme.primary)) {
    root.style.setProperty("--ios-blue", theme.primary);
    root.style.setProperty("--accent", theme.primary);
  }
  if (typeof theme.themeColor === "string" && /^#[0-9a-f]{6}$/i.test(theme.themeColor)) {
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme.themeColor);
  }
}

function assembleTourPackageData({ base, itinerary, hotels, experiences, resources, branding, features }) {
  const optionalsByDay = new Map((experiences.days || []).map((day) => [Number(day.number), day.optionals || []]));
  const mergedDays = (itinerary.days || []).map((day) => ({
    ...day,
    optionals: optionalsByDay.get(Number(day.number)) || []
  }));
  const tools = {
    ...(base.tools || {}),
    ...(resources.tools || {})
  };
  const assembled = {
    meta: assembleTourPackageMeta(base.meta || {}, branding, features),
    hostDefaults: base.hostDefaults,
    sourceDocuments: resources.sourceDocuments,
    sourceRules: resources.sourceRules,
    contacts: base.contacts,
    tools,
    hotels: hotels.hotels,
    days: mergedDays
  };
  Object.keys(base).forEach((key) => {
    if (!(key in assembled)) assembled[key] = base[key];
  });
  return validateLoadedTourData(assembled, "assembled tour package");
}

function findDuplicateJsonKey(text) {
  const stack = [];
  let index = 0;
  const skipWhitespace = () => {
    while (/\s/.test(text[index] || "")) index += 1;
  };
  const readString = () => {
    let value = "";
    index += 1;
    while (index < text.length) {
      const character = text[index];
      if (character === "\\") {
        value += character + (text[index + 1] || "");
        index += 2;
        continue;
      }
      if (character === "\"") {
        index += 1;
        return value;
      }
      value += character;
      index += 1;
    }
    return value;
  };
  while (index < text.length) {
    const character = text[index];
    const current = stack[stack.length - 1];
    if (character === "\"") {
      const value = readString();
      skipWhitespace();
      if (current && !current.array && current.expectingKey && text[index] === ":") {
        if (current.keys.has(value)) return value;
        current.keys.add(value);
        current.expectingKey = false;
        index += 1;
      }
      continue;
    }
    if (character === "{") {
      stack.push({ array: false, keys: new Set(), expectingKey: true });
    } else if (character === "[") {
      stack.push({ array: true });
    } else if (character === "}" || character === "]") {
      stack.pop();
    } else if (character === "," && current && !current.array) {
      current.expectingKey = true;
    }
    index += 1;
  }
  return "";
}

async function fetchPackageJson(url, label) {
  const response = await fetch(url, { cache: "no-store" }).catch((error) => {
    throw packageValidationError(`${label} could not be requested at ${url}: ${error.message}`);
  });
  if (!response.ok) {
    throw packageValidationError(`${label} could not be loaded at ${url} (${response.status}).`);
  }
  const text = await response.text();
  const duplicateKey = findDuplicateJsonKey(text);
  if (duplicateKey) {
    throw packageValidationError(`Invalid JSON in ${label} at ${url}: duplicate key "${duplicateKey}" is not allowed.`);
  }
  try {
    return JSON.parse(text);
  } catch (error) {
    throw packageValidationError(`Invalid JSON in ${label} at ${url}: ${error.message}`);
  }
}

async function loadPackagedTourData() {
  if (location.protocol === "file:") {
    const error = new Error("Tour package loading is unavailable from file URLs.");
    error.packageUnavailable = true;
    throw error;
  }
  const manifestUrl = tourPackageManifestUrl();
  const response = await fetch(manifestUrl, { cache: "no-store" }).catch((error) => {
    const unavailable = new Error(`Tour package manifest could not be requested at ${manifestUrl}: ${error.message}`);
    unavailable.packageUnavailable = true;
    throw unavailable;
  });
  if (response.status === 404) {
    const error = new Error(`Tour package not found at ${manifestUrl}. Falling back to legacy root tour data.`);
    error.packageUnavailable = true;
    throw error;
  }
  if (!response.ok) {
    throw packageValidationError(`Tour package manifest could not be loaded at ${manifestUrl} (${response.status}).`);
  }
  const manifestText = await response.text();
  const duplicateManifestKey = findDuplicateJsonKey(manifestText);
  if (duplicateManifestKey) {
    throw packageValidationError(`Invalid JSON in tour package manifest at ${manifestUrl}: duplicate key "${duplicateManifestKey}" is not allowed.`);
  }
  let manifest;
  try {
    manifest = JSON.parse(manifestText);
  } catch (error) {
    throw packageValidationError(`Invalid JSON in tour package manifest at ${manifestUrl}: ${error.message}`);
  }
  validateTourPackageManifest(manifest, manifestUrl);
  currentTourConfig = { ...currentTourConfig, packageManifest: manifest, legacyStorageSlug: manifest.legacyStorageSlug || currentTourConfig?.legacyStorageSlug };
  if (manifest.dataFiles.main) {
    const dataUrl = packageFileUrl(manifestUrl, manifest.dataFiles.main);
    if (!dataUrl) {
      throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Expected "dataFiles.main" to point to a JSON file.`);
    }
    return validateLoadedTourData(await fetchPackageJson(dataUrl, "Tour data"), dataUrl);
  }
  const urls = {
    base: packageFileUrl(manifestUrl, manifest.dataFiles.base),
    itinerary: packageFileUrl(manifestUrl, manifest.dataFiles.itinerary),
    hotels: packageFileUrl(manifestUrl, manifest.dataFiles.hotels),
    experiences: packageFileUrl(manifestUrl, manifest.dataFiles.experiences),
    resources: packageFileUrl(manifestUrl, manifest.dataFiles.resources),
    branding: packageFileUrl(manifestUrl, manifest.dataFiles.branding),
    features: packageFileUrl(manifestUrl, manifest.dataFiles.features)
  };
  if (Object.values(urls).some((url) => !url)) {
    throw packageValidationError(`Invalid tour package manifest at ${manifestUrl}. Expected all domain dataFiles to point to JSON files.`);
  }
  const base = validateBaseTourData(await fetchPackageJson(urls.base, "Base tour data"), urls.base);
  const itinerary = validateItineraryData(await fetchPackageJson(urls.itinerary, "Itinerary data"), urls.itinerary);
  const hotels = validateHotelsData(await fetchPackageJson(urls.hotels, "Hotels data"), urls.hotels);
  const experiences = validateExperiencesData(await fetchPackageJson(urls.experiences, "Experiences data"), urls.experiences);
  const resources = validateResourcesData(await fetchPackageJson(urls.resources, "Resources data"), urls.resources);
  const branding = validateBrandingData(await fetchPackageJson(urls.branding, "Branding data"), urls.branding);
  const features = validateFeaturesData(await fetchPackageJson(urls.features, "Features data"), urls.features);
  const brandProfiles = await loadBrandProfiles().catch(() => ({}));
  return assembleTourPackageData({ base, itinerary, hotels, experiences, resources, branding: applyBrandProfileToBranding(branding, brandProfiles), features });
}

function loadLegacyTourData(packageError) {
  if (window.BUSH_TOUR_DATA) {
    return Promise.resolve(validateLoadedTourData(window.BUSH_TOUR_DATA, "window.BUSH_TOUR_DATA"));
  }
  const dataUrls = legacyTourDataUrls();
  let lastStatus = 404;
  return dataUrls.reduce((chain, url) => {
    return chain.catch(() => fetch(url, { cache: "no-store" }).then((r) => {
      lastStatus = r.status;
      if (!r.ok) throw new Error(`Failed to load ${url} (${r.status})`);
      return r.json();
    }));
  }, Promise.reject(new Error("Trying data locations"))).then((data) => validateLoadedTourData(data, dataUrls.join(", "))).catch(() => {
    const packageMessage = packageError?.message ? `${packageError.message} ` : "";
    throw new Error(`${packageMessage}Failed to load data (${lastStatus}). Expected a valid tour package at ${tourPackageManifestUrl()}, or tour-data.json beside app.html or in the data folder.`);
  });
}

function migrateLegacyLocalStorageKeys() {
  const legacy = legacyStorageSlug();
  const code = tourCode();
  if (!legacy || legacy === code) return;
  const legacyPrefix = `tour:${legacy}:`;
  const currentPrefix = `tour:${code}:`;
  try {
    Object.keys(localStorage).forEach((key) => {
      if (!key.startsWith(legacyPrefix)) return;
      const nextKey = currentPrefix + key.slice(legacyPrefix.length);
      if (localStorage.getItem(nextKey) === null) {
        localStorage.setItem(nextKey, localStorage.getItem(key) || "");

    });
  } catch (error) {}
}

function meetingPointForItem(day, item) {
  if (shouldSuppressMeetingPoint(day, item)) return null;
  if (item?.disableMeetingPoint) return null;
  if (item?.meetingPoint && typeof item.meetingPoint === "object") {
    return {
      id: `mp-${day.number}-${slugify(item.title || item.time || "item")}`,
      label: item.meetingPoint.label || item.title || "Meeting point",
      note: item.meetingPoint.note || "Tap for walking directions. Live distance starts only if you allow location.",
      mapsUrl: item.meetingPoint.mapsUrl || meetingPointMapsUrl(item.meetingPoint.label || item.title || ""),
      summaryText: item.meetingPoint.summaryText || "Location available",
      distanceText: item.meetingPoint.distanceText || "Tap the map button for the exact pin."
    };
  }
  const title = String(item?.title || "");
  const config = getDayMeetingPointConfig(day.number) || { items: {} };
  const override = config.items?.[meetingPointItemKey(item)] || null;
  const explicitMeetingPoint = /\bmeeting point\b/i.test(title);
  if (!override && !explicitMeetingPoint) return null;
  const basePoint = {
    id: `mp-${day.number}-${slugify(title || item.time || "item")}`,
    label: title || "Meeting point",
    note: "Tap for walking directions. Live distance starts only if you allow location."
  };
  const merged = { ...basePoint, ...(override || {}) };
  if (merged.enabled === false) return null;
  return merged;
}

function shouldSuppressMeetingPoint(day, item) {
  const time = String(item?.time || "");
  const title = String(item?.title || "").toLowerCase();

function meetingPointIsActive(day, item) {

function tickDayOneCountdown() {
  const target = tourCountdownDate();
  const area = document.getElementById("cd-area");
  if (!target || !area) return;
  const diff = target - new Date();
  if (diff <= 0) {
    if (dayOneCountdownTimer) {
      clearInterval(dayOneCountdownTimer);
      dayOneCountdownTimer = null;
    }
    area.innerHTML = "";
    return;
  }
  const pad = (n) => String(n).padStart(2, "0");
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  const setText = (id, value) => {
    const node = document.getElementById(id);
    if (node) node.textContent = value;
  };
  setText("cd-d", pad(days));
  setText("cd-h", pad(hours));
  setText("cd-m", pad(mins));
  setText("cd-s", pad(secs));
}

function startDayOneCountdown() {
  if (dayOneCountdownTimer) {
    clearInterval(dayOneCountdownTimer);
    dayOneCountdownTimer = null;
  }
  const area = document.getElementById("cd-area");
  if (!area || activeTab !== "today") return;
  tickDayOneCountdown();
  if (area.innerHTML.trim()) {
    dayOneCountdownTimer = setInterval(tickDayOneCountdown, 1000);
  }
}

function itineraryPeriods(day) {
  if (DAY_PERIOD_OVERRIDES[day.number]) {
    return DAY_PERIOD_OVERRIDES[day.number].map((bucket) => ({
      period: bucket.period,
      text: bucket.text,
      pills: (bucket.highlights || []).map((item) => ({ label: item.label, category: item.category })),
      highlights: (bucket.highlights || []).map((item) => ({
        label: item.label,
        category: item.category,
        copy: resolveHighlightCopy(day, item)
      }))
    }));
  }

  const buckets = {
    morning: { text: [], pills: [] },
    afternoon: { text: [], pills: [] },
    evening: { text: [], pills: [] }
  };
  const seenText = new Set();
  const seenPills = new Set();
  const addText = (period, text) => {
    const clean = cleanActivityTitle(text);
    if (!clean) return;
    if ((day.optionals || []).some((optional) => optional.description && optionalTitleMatches(optional.title, clean))) return;
    const key = period + ':' + clean;
    if (seenText.has(key)) return;
    seenText.add(key);
    buckets[period].text.push(clean);
  };
  const addPill = (period, label, category) => {
    if (category !== 'optional' && (day.optionals || []).some((optional) => optional.description && optionalTitleMatches(optional.title, label))) return;
    const key = period + ':' + category + ':' + label;
    if (!label || seenPills.has(key)) return;
    seenPills.add(key);
    buckets[period].pills.push({ label, category });
  };

  for (const item of day.schedule || []) {
    if (scheduleOptionalHasRichCard(day, item)) continue;
    const period = periodForTime(item.time);
    if (!isLogisticsOnly(item.title)) addText(period, item.title);
    if (itemCategory(item) !== 'included' && !isLogisticsOnly(item.title)) addPill(period, cleanActivityTitle(item.title), itemCategory(item));
  }

  for (const optional of day.optionals || []) addPill(itineraryOptionalPeriod(day, optional), optional.title, 'optional');

  return ['morning', 'afternoon', 'evening'].map((period) => {
    const text = buckets[period].text.slice(0, 3).join(' · ');
    const highlights = [];
    for (const pill of buckets[period].pills) {
      const optional = (day.optionals || []).find((item) => item.title === pill.label);
      const copy = optional ? resolveHighlightCopy(day, { optionalNeedle: optional.title }) : pill.category === 'special' ? text : '';
      highlights.push({ ...pill, copy });
    }
    return { period, text, pills: buckets[period].pills, highlights };
  });
}

function openResourceWithFallback(event, url) {
  if (event) event.preventDefault();
  const variants = seatingPlanVariants(url);
  if (!variants.length) return false;
  if (typeof trackAnalytics === "function") trackAnalytics('document:open');
  const popup = window.open(variants[0], '_blank', 'noopener');
  if (!popup) return false;
  let settled = false;
  const tryNext = (index) => {
    if (settled || index >= variants.length) return;
    setTimeout(() => {
      if (settled) return;
      try { popup.location.replace(variants[index]); } catch (error) {}
      tryNext(index + 1);
    }, index === 0 ? 900 : 700);
  };
  popup.addEventListener?.('load', () => { settled = true; }, { once: true });
  tryNext(1);
  return false;
}

async function loadMenuChoices(menuKey = "riviera") {
  if (menuChoicesCache[menuKey]) return menuChoicesCache[menuKey];
  const sources = {
    riviera: "./menu-choices.json?v=2",
    moulinRouge: "./moulin-rouge-menu-choices.json?v=1"
  };
  try {
    const response = await fetch(sources[menuKey] || sources.riviera, { cache: "no-store" });
    if (!response.ok) throw new Error("Menu choices unavailable");
    const data = await response.json();
    menuChoicesCache[menuKey] = Array.isArray(data.choices) ? data.choices : [];
  } catch (error) {
    menuChoicesCache[menuKey] = [];
  }
  return menuChoicesCache[menuKey];
}

function menuChoiceResultHtml(item) {
  return `
      <div class="meal-choice-result-card">
      <div class="meal-choice-result-name">${escapeHtml(item.name || "Guest")}</div>
      ${item.menuNote ? `<div class="meal-choice-note">${escapeHtml(item.menuNote)}</div>` : ""}
      <div class="meal-choice-result-row"><span>Starter</span><div>${escapeHtml(item.starter || "Not selected")}</div></div>
      <div class="meal-choice-result-row"><span>Main</span><div>${escapeHtml(item.main || "Not selected")}</div></div>
      <div class="meal-choice-result-row"><span>Dessert</span><div>${escapeHtml(item.dessert || "Not selected")}</div></div>
    </div>`;
}

async function searchMenuChoice(dayNumber, menuKey = "riviera") {
  const input = document.getElementById(`menu-choice-name-${dayNumber}`);
  const result = document.getElementById(`menu-choice-result-${dayNumber}`);
  if (!input || !result) return;
  const query = normalizeLookupText(input.value);
  if (query.length < 2) {
    result.innerHTML = `<div class="meal-choice-note">Please type at least two letters of your name.</div>`;
    return;
  }
  result.innerHTML = `<div class="meal-choice-note">Checking menu choices...</div>`;
  const parts = query.split(" ").filter(Boolean);
  const choices = await loadMenuChoices(menuKey);
  const matches = choices.filter((item) => {
    const full = normalizeLookupText(item.name);
    const first = normalizeLookupText(item.first);
    const last = normalizeLookupText(item.last);
    return parts.every((part) => full.includes(part) || first.includes(part) || last.includes(part));
  }).sort((a, b) => String(a.last || "").localeCompare(String(b.last || "")) || String(a.first || "").localeCompare(String(b.first || "")));
  if (!matches.length) {
    result.innerHTML = `<div class="meal-choice-note">No menu choice found. Try your first name and surname together, or ask Brendon to check the list.</div>`;
    return;
  }
  if (matches.length === 1) {
    result.innerHTML = menuChoiceResultHtml(matches[0]);
    return;
  }
  result.innerHTML = matches.slice(0, 12).map((item) => `
    <button class="meal-choice-match-btn" type="button" onclick="showMenuChoiceMatch(${dayNumber}, '${jsString(item.name)}', '${jsString(menuKey)}')">${escapeHtml(item.name)}</button>
  `).join("") + (matches.length > 12 ? `<div class="meal-choice-note">Too many matches. Type more of your name.</div>` : "");
}

async function showMenuChoiceMatch(dayNumber, name, menuKey = "riviera") {
  const result = document.getElementById(`menu-choice-result-${dayNumber}`);
  if (!result) return;
  const choices = await loadMenuChoices(menuKey);
  const item = choices.find((choice) => choice.name === name);
  result.innerHTML = item ? menuChoiceResultHtml(item) : `<div class="meal-choice-note">That choice could not be opened. Please search again.</div>`;
}

function keepInHandText(day) {
  if (day && day.keepInHand) return day.keepInHand;
  const practical = Array.isArray(toolsConfig().practical) ? toolsConfig().practical : [];
  const keep = practical.find((item) => String(item.title || "").toLowerCase() === "keep in hand");
  return keep ? keep.body : "";
}

  return [item?.title, item?.note, item?.location, item?.label].filter(Boolean).join(" ").toLowerCase();

function routeDestinationMapCity(day) {
  const routeText = String(day?.technical?.routeTitle || day?.guest?.title || day?.routeTitle || day?.title || "").toLowerCase();
  const cityKeys = Object.keys(BRENDON_CITY_MAPS);
  const matches = cityKeys.filter((cityKey) => routeText.includes(cityKey));
  return matches[matches.length - 1] || "";
}

function timelineItemMatchesMapCity(day, item, cityKey) {
  if (day?.number === 10 && cityKey === 'lucerne') return false;
  const text = timelineMapMatchText(item);
  if (!text) return false;
  if (/\b(arrive hotel|arrive at hotel|arrive to the hotel|check-in)\b/.test(text) && routeDestinationMapCity(day) === cityKey) return true;
  if (cityKey === "paris") return /\b(paris|parisian|seine|arc de triomphe|montmartre|notre dame|latin quarter|nouvelle eve)\b/.test(text);
  if (cityKey === "lucerne") return /\b(lucerne|stanserhorn|stans)\b/.test(text);
  if (cityKey === "venice") return /\b(venice|venetian|tronchetto|motoscafo|st marks?|san marco|burano|gondola|grand canal)\b/.test(text);
  if (cityKey === "florence") return /\b(florence|florences|firenze|savonarola|renaissance|leather|duomo|santa croce)\b/.test(text);
  if (cityKey === "rome") return /\b(rome|roman|colosseum|st peters?|vatican|forum|piazzas? and fountains?)\b/.test(text);
  return false;
}

function isFirstTimelineMapItemForCity(day, item, cityKey) {
  const schedule = Array.isArray(day?.schedule) ? day.schedule : [];
  return schedule.find((candidate) => timelineItemMatchesMapCity(day, candidate, cityKey)) === item;
}

function initializeInformationMap() {
  if (!activeInformationMap || activeInformationMapMode === "original") return;
  const config = INFORMATION_MAPS[activeInformationMap];
  const mapEl = document.getElementById("information-map-el");
  if (!config || !mapEl || !window.L) return;
  if (informationMapInstance && informationMapInstance.getContainer && informationMapInstance.getContainer() !== mapEl) {
    informationMapInstance.remove();
    informationMapInstance = null;
    informationMapLayer = null;
  }
  if (!informationMapInstance) {
    informationMapInstance = L.map(mapEl, { zoomControl: true, scrollWheelZoom: true }).setView(config.center, config.zoom || 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(informationMapInstance);
    informationMapLayer = L.layerGroup().addTo(informationMapInstance);
  } else {
    informationMapInstance.invalidateSize();
    informationMapLayer.clearLayers();
  }
  const markers = [];
  (config.points || []).forEach((point) => {
    const icon = L.divIcon({
      className: "",
      html: `<div class="info-map-marker" style="--marker-color:${escapeHtml(point.color || "#ce1126")}"></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11],
      popupAnchor: [0, -10]
    });
    const marker = L.marker([point.lat, point.lng], { icon }).addTo(informationMapLayer);
    marker.bindPopup(`
      <div class="info-map-popup-title">${escapeHtml(point.title)}</div>
      <div class="info-map-popup-copy">${escapeHtml(point.copy || "")}</div>
      <a class="info-map-popup-link" href="${escapeHtml(mapUrlForQuery(`${point.title} ${config.city}`))}" target="_blank" rel="noopener">Open in Google Maps</a>
    `);
    markers.push(marker);
  });
  if (Array.isArray(config.route) && config.route.length > 1) {
    L.polyline(config.route, { color: "#25b45b", weight: 5, opacity: .82, dashArray: "8 8" }).addTo(informationMapLayer);
  }
  if (markers.length) {
    const group = L.featureGroup(markers);
    informationMapInstance.fitBounds(group.getBounds().pad(0.18));
  } else if (config.bounds) {
    informationMapInstance.fitBounds(config.bounds);
  }
  setTimeout(() => informationMapInstance?.invalidateSize(), 80);
}

function withGlobalVoxReminder(reminders) {
  const items = Array.isArray(reminders) ? reminders : [];
  if (!GLOBAL_VOX_NOTE || GLOBAL_VOX_EXCLUDED_DAYS.has(displayDayNumber())) return items;
  const nonVoxItems = items.filter((item) => !/vox/i.test(`${item?.title || ""} ${item?.body || ""}`));
  const existingVox = items.find((item) => /vox/i.test(`${item?.title || ""} ${item?.body || ""}`));
  return [...nonVoxItems, existingVox ? { ...existingVox } : { ...GLOBAL_VOX_NOTE }];
}

const END_OF_DAY_PREVIEW_TIME_ZONE = "Europe/Rome";
const END_OF_DAY_PREVIEW_UNLOCK_MINS = (20 * 60) + 30;

function nowStampInTimeZone(timeZone) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).formatToParts(new Date()).reduce((acc, part) => {
    acc[part.type] = part.value;
    return acc;
  }, {});
  return {
    date: `${parts.year}-${parts.month}-${parts.day}`,
    mins: (Number(parts.hour || 0) % 24) * 60 + Number(parts.minute || 0)
  };
}

function compareDayStamp(a, b) {
  if (!a || !b) return 0;
  if (a.date < b.date) return -1;
  if (a.date > b.date) return 1;
  return (a.mins || 0) - (b.mins || 0);
}

function shouldShowEndOfDayPreview(day) {
  if (!day?.date) return false;
  if (tour?.meta?.slug === "london-to-rome-highlights-2026" && day.number === 10) return false;
  if (ADMIN_MODE) return true;
  const now = nowStampInTimeZone(END_OF_DAY_PREVIEW_TIME_ZONE);
  const unlock = { date: day.date, mins: END_OF_DAY_PREVIEW_UNLOCK_MINS };
  return compareDayStamp(now, unlock) >= 0;
}

let builderReviewAssetsPromise = null;

function builderReviewMode() {
  return builderPreviewMode() && location.protocol !== "file:";
}

function builderReviewApiUrl(path) {
  return `./api/review/${path}`;
}

async function builderReviewRequest(path, payload = null) {
  const options = payload
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) }
    : { method: "GET" };
  const response = await fetch(builderReviewApiUrl(path), options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok === false) throw new Error(data.error || "The review edit could not be saved.");
  return data;
}

async function loadBuilderReviewAssets() {
  if (!builderReviewAssetsPromise) builderReviewAssetsPromise = builderReviewRequest("assets");
  return builderReviewAssetsPromise;
}

function builderReviewAssetSrc(value = "") {
  const text = String(value || "").trim();
  if (!text) return "";
  if (/^(https?:|data:|\/)/i.test(text)) return text;
  return text.replace(/^\.?\//, "");
}

function builderReviewTitleKey(value = "") {
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function builderReviewStatus(message, tone = "info") {
  let node = document.getElementById("builder-review-status");
  if (!node) {
    node = document.createElement("div");
    node.id = "builder-review-status";
    document.body.appendChild(node);
  }
  node.className = `builder-review-status ${tone}`;
  node.textContent = message;
  window.clearTimeout(builderReviewStatus.timer);
  builderReviewStatus.timer = window.setTimeout(() => node.remove(), 4200);
}

function ensureBuilderReviewModal() {
  let modal = document.getElementById("builder-review-modal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "builder-review-modal";
    modal.className = "builder-review-modal";
    modal.innerHTML = `
      <div class="builder-review-dialog" role="dialog" aria-modal="true" aria-labelledby="builder-review-title">
        <div class="builder-review-dialog-head">
          <div id="builder-review-title" class="builder-review-dialog-title"></div>
          <button class="builder-review-icon-btn" type="button" onclick="closeBuilderReviewModal()" aria-label="Close">x</button>
        </div>
        <div id="builder-review-body" class="builder-review-dialog-body"></div>
      </div>`;
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeBuilderReviewModal();
    });
    document.body.appendChild(modal);
  }
  return modal;
}

function showBuilderReviewModal(title, body) {
  const modal = ensureBuilderReviewModal();
  modal.querySelector("#builder-review-title").textContent = title;
  modal.querySelector("#builder-review-body").innerHTML = body;
  modal.classList.add("open");
}

function closeBuilderReviewModal() {
  document.getElementById("builder-review-modal")?.classList.remove("open");
}

function builderReviewReload(message) {
  builderReviewStatus(message, "success");
  setTimeout(() => {
    const params = new URLSearchParams(location.search);
    params.set("tour", tourCode());
    params.set("builderPreview", "1");
    params.set("previewTab", activeTab);
    if (displayDayNumber()) params.set("previewDay", String(displayDayNumber()));
    location.assign(`${location.pathname}?${params.toString()}`);
  }, 350);
}

function builderReviewHeroButton(day) {

  return `

}

function builderReviewExperienceControls(optional, day) {
  if (!builderReviewMode() || !optional || !day) return "";
  const optionalIndex = (day.optionals || []).indexOf(optional);
  if (optionalIndex < 0) return "";
  return `
    <div class="builder-review-card-controls">
      <button class="builder-review-btn" type="button" onclick="openBuilderReviewExperienceImagePicker(${Number(day.number)}, ${Number(optionalIndex)}, '${jsString(optional.title || "Experience")}');return false;">Change Image</button>
      <button class="builder-review-btn danger" type="button" onclick="removeBuilderReviewExperience(${Number(day.number)}, ${Number(optionalIndex)}, '${jsString(optional.title || "Experience")}');return false;">Remove</button>
    </div>`;
}

function findBuilderReviewExperienceOccurrence(optionalTitle) {
  const key = builderReviewTitleKey(optionalTitle);
  for (const day of tour.days || []) {
    const optionals = day.optionals || [];
    for (let index = 0; index < optionals.length; index += 1) {
      const optional = optionals[index];
      const keys = [optional.title, optional.sourceTitle, optional.experienceId].map(builderReviewTitleKey);
      if (keys.includes(key)) return { day, optional, optionalIndex: index };
    }
  }
  return null;
}

function builderReviewExperienceControlsByTitle(optionalTitle) {
  const occurrence = findBuilderReviewExperienceOccurrence(optionalTitle);
  return occurrence ? builderReviewExperienceControls(occurrence.optional, occurrence.day) : "";
}

function builderReviewImageOptions(images, selectedValue = "", labelFor = (item) => item.destination || item.imageId) {
  return images.map((item) => {
    const value = item.file || item.imageUrl || "";
    const selected = value === selectedValue || item.imageId === selectedValue ? "selected" : "";
    return `<option value="${escapeHtml(value || item.imageId)}" data-image-id="${escapeHtml(item.imageId || "")}" data-src="${escapeHtml(builderReviewAssetSrc(value))}" ${selected}>${escapeHtml(labelFor(item))}</option>`;
  }).join("");
}

function updateBuilderReviewImagePreview(selectId, imgId) {
  const select = document.getElementById(selectId);
  const img = document.getElementById(imgId);
  if (!select || !img) return;
  const option = select.selectedOptions[0];
  const src = option?.dataset?.src || builderReviewAssetSrc(select.value);
  img.src = src;
}

function onwardInputValue(id) { return (document.getElementById(id)?.value || '').trim(); }
let onwardSaving = false;
async function submitOnwardTravel() {
  if (onwardSaving) return;
  const status = document.getElementById('onward-status'), button = document.getElementById('onward-submit');
  const fail = message => { if (status) status.textContent = message; };
  if (!USE_REMOTE_STORAGE || !authState.csrfToken) return fail('The submission service is unavailable. Please try again later.');
  const previous = loadLocalOnwardTravel() || {};
  const name = onwardInputValue('onward-name');
  const plan = document.querySelector("input[name='onward-plan']:checked")?.value || 'flying';
  if (!name) return fail('Please enter your full name.');
  const payload = {name,plan,partySize:Number(onwardInputValue('onward-people')),sharedKey:previous.sharedKey || `onward:${crypto.randomUUID()}`};
  if (![1,2].includes(payload.partySize)) return fail('Please choose one person or two people.');
  if (plan === 'flying') {
    for (const [field,id] of Object.entries({airport:'airport',flightDate:'flight-date',flightTime:'flight-time',terminal:'terminal',airline:'airline',flightNumber:'flight-number',transferType:'transfer'})) {
      const input=document.getElementById('onward-'+id);
      if (!input?.value?.trim() || (input.checkValidity && !input.checkValidity())) return fail('Please complete all flight fields and choose your transfer arrangements.');
      payload[field]=input.value.trim();
    }
  }
  if (plan === 'flying' && payload.transferType === 'complimentary' && payload.flightTime <= '10:30') return fail('The complimentary transfer is for flights after 10:30. Please choose PT/private transfer or own arrangements.');
  if (plan === 'eurostar') {
    payload.londonFlying = 'yes';
    for (const [field,id] of Object.entries({londonFlightDate:'london-flight-date',londonFlightTime:'london-flight-time',londonTerminal:'london-terminal',londonFlightNumber:'london-flight-number'})) {
      payload[field]=onwardInputValue('onward-'+id);if(!payload[field])return fail('Please complete your London flight date, time, flight number and terminal.');
    }
  }
  // Keep an existing submission key for a retry, without falsely marking the form submitted.
  saveLocalOnwardTravel({...previous,sharedKey:payload.sharedKey});
  onwardSaving = true; if(button) button.disabled=true; fail('Saving details…');
  try {
    ensureToolStorage();
    await window.storage.set(payload.sharedKey,JSON.stringify(payload),true);
    payload.submittedAt=new Date().toISOString();saveLocalOnwardTravel(payload);onwardSheetRows=null;remoteAnalyticsCache=null;showOnwardOpeningPrompt=false;
    trackAnalytics('onward:submitted');fail('Thank you. Your onward travel details have been submitted.');
  } catch { trackAnalytics('onward:failed'); fail('Your details were not confirmed saved. Please retry while signed in.'); }
  finally { onwardSaving=false;if(button)button.disabled=false; }
}

      <div class="prog-intro-text">Your included visit to Murano includes a glassblowing demonstration by master artisans at CAM — a craft practised on this island continuously since 1291. This is also our certified <strong style="color:var(--text)">Make Travel Matter®</strong> experience.</div>

function toolOrderKey() { return storageKey("tools-order"); }

function shareTextForToday() {
  const day = dayByNumber(displayDayNumber());
  if (!day) return "";
  const bits = [
    `Day ${day.number} · ${day.guest.title || day.technical.routeTitle}`,
    dateLong(day.date),
    routeLabel(day),
    "",
    ...(day.schedule || []).map((item) => `${item.time || "TBC"} · ${item.title}${item.note ? ` — ${item.note}` : ""}`)
  ];
  return bits.join("\n");
}

function normalizeToolOrder(order) {
  const incoming = Array.isArray(order) ? order.filter((id) => BEST_TOOL_DEFAULT_ORDER.includes(id)) : [];
  return [...incoming, ...BEST_TOOL_DEFAULT_ORDER.filter((id) => !incoming.includes(id))];
}

function loadToolsOrder() {
  if (toolOrder.length) return toolOrder;
  try {
    const raw = localStorage.getItem(toolOrderKey());
    toolOrder = normalizeToolOrder(raw ? JSON.parse(raw) : BEST_TOOL_DEFAULT_ORDER);
  } catch (error) {
    toolOrder = BEST_TOOL_DEFAULT_ORDER.slice();
  }
  return toolOrder;
}

function saveToolsOrder() {
  try { localStorage.setItem(toolOrderKey(), JSON.stringify(toolOrder)); } catch (error) {}
}

function moveToolBefore(sourceId, targetId) {
  const next = toolOrder.filter((id) => id !== sourceId);
  const index = Math.max(0, next.indexOf(targetId));
  next.splice(index, 0, sourceId);
  toolOrder = normalizeToolOrder(next);
  saveToolsOrder();
}

function toggleToolsReorder() {
  toolsReorderMode = !toolsReorderMode;
  selectedToolMoveSource = null;
  renderApp();
}

function resetToolsOrder() {
  toolOrder = BEST_TOOL_DEFAULT_ORDER.slice();
  saveToolsOrder();
  toolsReorderMode = false;
  selectedToolMoveSource = null;
  renderApp();
}

function handleToolCardClick(id) {
  if (!toolsReorderMode) {
    openToolPanel(id);
    return;
  }
  if (!selectedToolMoveSource) {
    selectedToolMoveSource = id;
  } else if (selectedToolMoveSource === id) {
    selectedToolMoveSource = null;
  } else {
    moveToolBefore(selectedToolMoveSource, id);
    selectedToolMoveSource = null;
  }
  renderApp();
}

function buildWeatherDestinations() {

function weatherSummary(code) {
  const map = { 0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Rain", 63: "Rain", 65: "Heavy rain", 71: "Snow", 73: "Snow", 75: "Heavy snow", 80: "Showers", 81: "Showers", 82: "Heavy showers", 95: "Storm", 96: "Storm", 99: "Storm" };
  return map[code] || "Variable";
}

function weatherTheme(code) {
  if (code === 0) return "sunny";
  if (code === 1 || code === 2 || code === 3) return "cloudy";
  if (code === 45 || code === 48) return "fog";
  if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(Number(code))) return "rain";
  if ([71, 73, 75].includes(Number(code))) return "snow";
  if ([95, 96, 99].includes(Number(code))) return "storm";
  return "sunny";
}

function weatherIcon(code) {
  if (code === 0) return "🌞";
  if (code === 1) return "🌤️";
  if (code === 2) return "🌥️";
  if (code === 3) return "☁️";
  if (code === 45 || code === 48) return "🌫️";
  if ([51, 53, 55, 61, 63, 65].includes(Number(code))) return "🌧️";
  if ([80, 81, 82].includes(Number(code))) return "🌦️";
  if ([71, 73, 75].includes(Number(code))) return "🌨️";
  if ([95, 96, 99].includes(Number(code))) return "⛈️";
  return "🌤️";
}

async function loadSeatingWeatherChips() {
  const chips = [...document.querySelectorAll(".seating-weather-chip[data-city]")];
  await Promise.all(chips.map(async (chip) => {
    const city = chip.dataset.city || "";
    const coords = TOOL_CITY_COORDS[city] || TOOL_ROUTE_POINTS[city];
    if (!coords) {
      chip.classList.remove("weather-caution", "weather-danger");
      chip.innerHTML = `<span class="seating-weather-icon" aria-hidden="true">🌤️</span><span class="seating-weather-temp">Weather</span><span class="seating-weather-summary">${escapeHtml(city || "Route")}</span>`;
      return;
    }
    try {
      const [lat, lon] = coords;
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`, { cache: "no-store" });
      if (!res.ok) throw new Error("Weather unavailable");
      const data = await res.json();
      const daily = data.daily || {};
      const max = Math.round(Number(daily.temperature_2m_max?.[0]));
      const min = Math.round(Number(daily.temperature_2m_min?.[0]));
      const code = daily.weathercode?.[0];
      const tempText = Number.isFinite(max) && Number.isFinite(min)
        ? `${max}°C/${celsiusToFahrenheit(max)}°F`
        : "Weather";
      chip.classList.toggle("weather-caution", weatherTheme(code) === "rain");
      chip.classList.toggle("weather-danger", weatherTheme(code) === "storm");
      chip.innerHTML = `<span class="seating-weather-icon" aria-hidden="true">${weatherIcon(code)}</span><span class="seating-weather-temp">${escapeHtml(tempText)}</span><span class="seating-weather-summary">${escapeHtml(weatherSummary(code))}</span>`;
    } catch (error) {
      chip.classList.remove("weather-caution", "weather-danger");
      chip.innerHTML = `<span class="seating-weather-icon" aria-hidden="true">🌤️</span><span class="seating-weather-temp">Weather</span><span class="seating-weather-summary">Tap tools</span>`;
    }
  }));
}

async function fetchWeatherForecast(city, coords) {
  if (!coords) throw new Error("Missing coordinates");
  const [lat, lon] = coords;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max&temperature_unit=celsius&windspeed_unit=kmh&timezone=auto&forecast_days=2`;
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("Weather unavailable");
  const json = await res.json();
  return { city, json };
}

function weatherCityImage(city) {
  const dayByCity = { Rome: 2, Florence: 4, Pisa: 5, Venice: 6, Lucerne: 8, Paris: 10 };
  return todayHeroImage(dayByCity[city]) || todayHeroImage(displayDayNumber()) || "";
}

function weatherDateLabel(value) {
  if (!value) return "";
  return new Date(`${value}T00:00:00`).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).toUpperCase();
}

function weatherTempLine(max, min) {
  const c = Number(max);
  const f = Number.isFinite(c) ? celsiusToFahrenheit(c) : null;
  const cMin = Number(min);
  return Number.isFinite(c)
    ? `${f}°F / ${Math.round(c)}°C`
    : `--°F / --°C`;
}

function weatherForecastCardMarkup({ city, json }) {
  const daily = json.daily || {};
  const todayCode = daily.weathercode?.[0];
  const tomorrowCode = daily.weathercode?.[1];
  const image = weatherCityImage(city);
  const todayRain = Math.round(Number(daily.precipitation_sum?.[0] || 0));
  const tomorrowRain = Math.round(Number(daily.precipitation_sum?.[1] || 0));
  const todayWind = Math.round(Number(daily.windspeed_10m_max?.[0] || 0));
  const tomorrowWind = Math.round(Number(daily.windspeed_10m_max?.[1] || 0));
  return `
    <div class="weather-forecast-card weather-${weatherTheme(todayCode)}">
      <div class="weather-forecast-hero" style="--weather-img:url('${escapeHtml(image)}')">
        <div class="weather-forecast-city">${escapeHtml(city)}</div>
        <div class="weather-forecast-summary">${escapeHtml(weatherSummary(todayCode))} today</div>
      </div>
      <div class="weather-forecast-icon" aria-hidden="true">${weatherIcon(todayCode)}</div>
      <div class="weather-forecast-body">
        <div class="weather-forecast-row">
          <div class="weather-forecast-badge">Today</div>
          <div class="weather-icon-inline" aria-hidden="true">${weatherIcon(todayCode)}</div>
          <div>
            <div class="weather-forecast-temp">${escapeHtml(weatherTempLine(daily.temperature_2m_max?.[0], daily.temperature_2m_min?.[0]))}</div>
            <div class="weather-forecast-copy">${escapeHtml(weatherSummary(todayCode))} at noon</div>
          </div>
        </div>
        <div class="weather-forecast-row">
          <div class="weather-forecast-badge">Tomorrow</div>
          <div class="weather-icon-inline" aria-hidden="true">${weatherIcon(tomorrowCode)}</div>
          <div>
            <div class="weather-forecast-temp">${escapeHtml(weatherTempLine(daily.temperature_2m_max?.[1], daily.temperature_2m_min?.[1]))}</div>
            <div class="weather-forecast-copy">${escapeHtml(weatherSummary(tomorrowCode))} at noon</div>
          </div>
        </div>
        <div class="weather-forecast-meta">
          <div><strong>${escapeHtml(weatherDateLabel(daily.time?.[0]))}</strong><span>${todayWind} km/h wind · ${todayRain} mm rain</span></div>
          <div><strong>${escapeHtml(weatherDateLabel(daily.time?.[1]))}</strong><span>${tomorrowWind} km/h wind · ${tomorrowRain} mm rain</span></div>
        </div>
      </div>
    </div>`;
}

function setWeatherStatus(message) {
  const node = document.getElementById("weather-status");
  if (node) node.textContent = message || "";
}

async function searchWeatherCity() {
  const input = document.getElementById("weather-city-search");
  const target = document.getElementById("weather-custom-result");
  const query = input?.value?.trim() || "";
  if (!query || !target) return;
  setWeatherStatus("Searching weather...");
  try {
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`, { cache: "no-store" });
    if (!geo.ok) throw new Error("City search unavailable");
    const data = await geo.json();
    const place = data.results?.[0];
    if (!place) throw new Error("City not found");
    const label = [place.name, place.country_code].filter(Boolean).join(", ");
    const forecast = await fetchWeatherForecast(label, [place.latitude, place.longitude]);
    target.innerHTML = weatherForecastCardMarkup(forecast);
    setWeatherStatus(`Showing ${label}.`);
  } catch (error) {
    target.innerHTML = "";
    setWeatherStatus(error.message || "Unable to search that city.");
  }
}

function useCurrentWeatherLocation() {
  const target = document.getElementById("weather-custom-result");
  if (!navigator.geolocation || !target) {
    setWeatherStatus("Current location is not available in this browser.");
    return;
  }
  setWeatherStatus("Checking your current location...");
  navigator.geolocation.getCurrentPosition(async (position) => {
    try {
      const coords = [position.coords.latitude, position.coords.longitude];
      const forecast = await fetchWeatherForecast("Current location", coords);
      target.innerHTML = weatherForecastCardMarkup(forecast);
      setWeatherStatus("Showing weather for your current location.");
    } catch (error) {
      target.innerHTML = "";
      setWeatherStatus("Unable to load weather for your current location.");
    }
  }, () => {
    setWeatherStatus("Location permission was not allowed.");
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
}

let latestRates = {};
async function loadRatesTool() {
  const body = document.getElementById("tool-rates-body");
  if (!body) return;
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/EUR");
    const json = await res.json();
    latestRates = json.rates || {};
  } catch (error) {
    latestRates = { EUR: 1, GBP: 0.86, USD: 1.09, AUD: 1.66, NZD: 1.8 };
  }
  calcToolRates();
}

function calcToolRates() {
  const body = document.getElementById("tool-rates-body");
  if (!body) return;
  const amount = Number(document.getElementById("rates-amount")?.value || 100);
  ratesBase = document.getElementById("rates-base")?.value || ratesBase || "EUR";
  const baseRate = ratesBase === "EUR" ? 1 : latestRates[ratesBase];
  const eurAmount = baseRate ? amount / baseRate : 0;
  body.innerHTML = TOOL_RATE_CURRENCIES.map((currency) => {
    const rate = currency.code === "EUR" ? 1 : latestRates[currency.code];
    const total = rate ? (eurAmount * rate).toFixed(2) : "-";
    const note = currency.code === ratesBase ? "Base currency" : "Live from " + ratesBase;
    return `<div class="resource-card"><div class="resource-title">${escapeHtml(currency.label)}</div><div class="resource-copy">${escapeHtml(currency.symbol)} ${total}</div><div class="tool-admin-caption">${escapeHtml(note)}</div></div>`;
  }).join("");
}

async function doTranslate() {
  changeTranslateLangs();
  const input = document.getElementById("translate-input");
  const output = document.getElementById("translate-result");
  if (!input || !output || !input.value.trim()) return;
  output.textContent = "Translating…";
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(input.value.trim())}&langpair=${translateFrom}|${translateTo}`);
    const json = await res.json();
    output.textContent = json.responseData?.translatedText || "Translation unavailable.";

  } catch (error) {

}

function speakTranslation() {

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

function startVoice() {
  const button = document.getElementById("voice-btn");
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognitionCtor) {
    alert("Voice input is not supported on this browser. Please type your phrase instead.");
    return;
  }
  if (voiceRec) {
    voiceRec.stop();
    voiceRec = null;
    if (button) {
      button.textContent = "🎤";
      button.classList.remove("on");
    }
    return;
  }
  voiceRec = new SpeechRecognitionCtor();
  voiceRec.lang = ({ en: "en-US", it: "it-IT", de: "de-DE", fr: "fr-FR", nl: "nl-NL" }[translateFrom] || "en-US");
  voiceRec.onstart = () => {
    if (!button) return;
    button.textContent = "⏹";
    button.classList.add("on");
  };
  voiceRec.onresult = (event) => {
    const transcript = event.results?.[0]?.[0]?.transcript || "";

    if (button) {

    }

  };

}

function renderTodayTimelineNowLine() {
  const day = dayByNumber(displayDayNumber());
  const timeline = document.getElementById("today-timeline");
  if (!day || !timeline || !isDisplayedDayToday(day)) return;
  timeline.querySelectorAll(".tl-nowline").forEach((node) => node.remove());
  const items = (day.schedule || []).map((item, index) => ({ index, mins: parseScheduleTime(item.time) })).filter((item) => item.mins !== null);
  if (!items.length) return;
  const rows = [...timeline.querySelectorAll(".tl-item")];
  if (!rows.length) return;
  const rowDotCenter = (item) => {
    const row = rows[item.index];
    const dot = row?.querySelector(".tl-icon");
    if (!row || !dot) return null;
    return row.offsetTop + dot.offsetTop + (dot.offsetHeight / 2);
  };
  const nowMins = (new Date().getHours() * 60) + new Date().getMinutes();
  let top = null;
  if (nowMins <= items[0].mins) {
    const firstY = rowDotCenter(items[0]);
    if (firstY !== null) top = Math.max(12, firstY - 18);
  } else {
    const prev = [...items].reverse().find((item) => item.mins <= nowMins);
    const next = items.find((item) => item.mins > nowMins);
    if (prev && next) {
      const prevY = rowDotCenter(prev);
      const nextY = rowDotCenter(next);
      if (prevY !== null && nextY !== null) {
        const span = Math.max(1, next.mins - prev.mins);
        const ratio = Math.min(1, Math.max(0, (nowMins - prev.mins) / span));
        top = prevY + ((nextY - prevY) * ratio);
      }
    } else if (prev) {
      const prevY = rowDotCenter(prev);
      if (prevY !== null) {
        const ratio = Math.min(1, Math.max(0, (nowMins - prev.mins) / 120));
        top = prevY + (ratio * 46);
      }
    }
  }
  if (top === null) return;
  const marker = document.createElement("div");
  marker.className = "tl-nowline";
  marker.style.top = `${Math.round(Math.max(10, Math.min(top, timeline.scrollHeight - 14)))}px`;
  marker.innerHTML = `<span class="tl-nowline-time">${formatScheduleMins(nowMins)}</span>`;
  timeline.appendChild(marker);
}

function compareOpeningStamp(a, b) {
  if (!a || !b) return 0;
  if (a.date < b.date) return -1;
  if (a.date > b.date) return 1;
  return (a.mins || 0) - (b.mins || 0);
}

function openingStampFromParts(parts) {
  if (!parts || !parts.date) return null;
  return { date: parts.date, mins: ((parts.hour || 0) * 60) + (parts.minute || 0) };
}

function currentLocalOpeningStamp() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  return { date: `${yyyy}-${mm}-${dd}`, mins: (now.getHours() * 60) + now.getMinutes() };
}

function formatOpeningTime(parts) {
  if (!parts || typeof parts.hour !== "number") return "";
  return `${String(parts.hour).padStart(2, "0")}:${String(parts.minute || 0).padStart(2, "0")}`;
}

function getEssentialsHoursStatus(place) {
  const opening = place?.poi?.openingHours || place?.openingHours;
  const ranges = Array.isArray(opening?.timeRanges) ? opening.timeRanges : [];
  if (!ranges.length) return null;
  const now = currentLocalOpeningStamp();
  const normalized = ranges.map((range) => ({
    start: openingStampFromParts(range.startTime),
    end: openingStampFromParts(range.endTime),
    startRaw: range.startTime,
    endRaw: range.endTime
  })).filter((range) => range.start && range.end).sort((a, b) => compareOpeningStamp(a.start, b.start));
  if (!normalized.length) return null;
  const active = normalized.find((range) => compareOpeningStamp(range.start, now) <= 0 && compareOpeningStamp(now, range.end) < 0);
  if (active) {
    const closes = formatOpeningTime(active.endRaw);
    return { tone: "open", text: closes ? `Open now · until ${closes}` : "Open now" };
  }
  const upcoming = normalized.find((range) => compareOpeningStamp(range.start, now) > 0);
  if (upcoming) {
    const opens = formatOpeningTime(upcoming.startRaw);
    const sameDay = upcoming.start.date === now.date;
    return { tone: "closed", text: sameDay ? (opens ? `Closed now · opens ${opens}` : "Closed now") : (opens ? `Closed today · tomorrow from ${opens}` : "Closed today") };
  }
  return { tone: "closed", text: "Closed for today" };
}

async function searchEssentials(query, icon, color, label = query) {
  const resultsEl = document.getElementById("ess-results");
  const mapWrap = document.getElementById("ess-map-wrap");
  const mapEl = document.getElementById("ess-map-el");
  if (!resultsEl) return;
  if (!TOMTOM_KEY) {
    resultsEl.innerHTML = `<div class="tool-empty">Nearby search needs a runtime map-search API key before it can be used.</div>`;
    if (mapWrap) mapWrap.style.display = "none";
    return;
  }
  resultsEl.innerHTML = `<div class="tool-empty">${icon} Finding nearby ${escapeHtml(label)}…</div>`;
  let lat;
  let lon;
  try {
    const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000, enableHighAccuracy: true }));
    lat = pos.coords.latitude;
    lon = pos.coords.longitude;
  } catch (error) {
    resultsEl.innerHTML = `<div class="tool-empty">Location access is needed for nearby results. Please enable GPS and try again.</div>`;
    if (mapWrap) mapWrap.style.display = "none";
    return;
  }
  try {
    const response = await fetch(`https://api.tomtom.com/search/2/poiSearch/${encodeURIComponent(query)}.json?lat=${lat}&lon=${lon}&radius=2000&limit=6&openingHours=nextSevenDays&key=${TOMTOM_KEY}`);
    const json = await response.json();
    const results = json.results || [];
    if (!results.length) {
      resultsEl.innerHTML = `<div class="tool-empty">Nothing was found nearby. Try again from a busier part of town.</div>`;
      if (mapWrap) mapWrap.style.display = "none";
      return;
    }
    resultsEl.innerHTML = results.map((place) => {
      const dist = place.dist < 1000 ? `${Math.round(place.dist)}m away` : `${(place.dist / 1000).toFixed(1)}km away`;
      const addr = place.address?.streetName ? `${place.address.streetName}${place.address.streetNumber ? ` ${place.address.streetNumber}` : ""}` : (place.address?.freeformAddress || "");
      const name = place.poi?.name || label;
      const destination = `${place.position.lat},${place.position.lon}`;
      const walkUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&travelmode=walking`;
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${name} ${addr}`.trim() || destination)}`;
      const hours = getEssentialsHoursStatus(place);
      return `
        <div class="tool-route-item">
          <div class="tool-route-body">
            <div class="tool-title">${escapeHtml(name)}</div>
            <div class="copy">${escapeHtml(addr)}</div>
            <div class="tool-admin-caption" style="margin-top:6px;color:${escapeHtml(color)}">${escapeHtml(dist)}</div>
            ${hours ? `<div class="tool-admin-caption" style="margin-top:4px;color:${hours.tone === "open" ? "#34c759" : "var(--mid)"}">${escapeHtml(hours.text)}</div>` : ""}
            <div class="button-row" style="margin-top:12px">
              <a class="button secondary" href="${walkUrl}" target="_blank" rel="noopener">Walk there</a>
              <a class="button secondary" href="${mapUrl}" target="_blank" rel="noopener">Open in Google Maps</a>
            </div>
          </div>
        </div>`;
    }).join("");
    if (mapWrap && mapEl && window.L) {
      mapWrap.style.display = "block";
      if (essentialsMap && essentialsMap.getContainer && essentialsMap.getContainer() !== mapEl) {
        essentialsMap.remove();
        essentialsMap = null;
        essentialsMapLayer = null;
      }
      if (!essentialsMap) {
        essentialsMap = L.map(mapEl, { zoomControl: true }).setView([lat, lon], 14);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
          attribution: "&copy; OpenStreetMap &copy; CARTO",
          maxZoom: 19
        }).addTo(essentialsMap);
        essentialsMapLayer = L.layerGroup().addTo(essentialsMap);
      } else {
        essentialsMap.invalidateSize();
        essentialsMapLayer.clearLayers();
      }
      const markers = [L.marker([lat, lon]).addTo(essentialsMapLayer).bindPopup("Your location")];
      results.forEach((place) => {
        markers.push(L.marker([place.position.lat, place.position.lon]).addTo(essentialsMapLayer).bindPopup(`<strong>${escapeHtml(place.poi?.name || label)}</strong>`));
      });
      const group = L.featureGroup(markers);
      essentialsMap.fitBounds(group.getBounds().pad(0.22));
    }
  } catch (error) {
    resultsEl.innerHTML = `<div class="tool-empty">Unable to fetch nearby results right now.</div>`;
    if (mapWrap) mapWrap.style.display = "none";
  }
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function withTimeout(promise, timeoutMs, message) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(message || "Timed out")), timeoutMs);
    Promise.resolve(promise)
      .then((value) => {
        clearTimeout(timer);
        resolve(value);
      })
      .catch((error) => {
        clearTimeout(timer);
        reject(error);
      });
  });
}

function loadImageFromDataUrl(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function canvasToBlob(canvas, type, quality) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), type, quality);
  });
}

function safePhotoFileName(name = "tour-photo.jpg") {
  const base = String(name)
    .replace(/\.[a-z0-9]{2,5}$/i, "")
    .replace(/[^a-z0-9]+/gi, "-")
    .replace(/^-|-$/g, "")
    .toLowerCase() || "tour-photo";
  return `${base}.jpg`;
}

async function compressImageToJpeg(image, options = {}) {
  let width = image.naturalWidth || image.width;
  let height = image.naturalHeight || image.height;
  const maxDimension = options.maxDimension || 1000;
  const longestSide = Math.max(width, height);
  if (longestSide > maxDimension) {
    const scale = maxDimension / longestSide;
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }

  let bestBlob = null;
  let workingWidth = width;
  let workingHeight = height;
  let quality = options.quality || 0.72;
  const minQuality = options.minQuality || 0.38;
  const targetBytes = options.targetBytes || 220000;
  const attempts = options.attempts || 8;

  for (let attempt = 0; attempt < attempts; attempt += 1) {
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(workingWidth));
    canvas.height = Math.max(1, Math.round(workingHeight));
    const ctx = canvas.getContext("2d");
    if (!ctx) break;
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    const blob = await withTimeout(canvasToBlob(canvas, "image/jpeg", quality), 5000, "Could not compress photo");
    if (!blob) break;
    bestBlob = blob;
    if (blob.size <= targetBytes) break;
    if (quality > minQuality) {
      quality -= 0.08;
    } else {
      workingWidth *= 0.78;
      workingHeight *= 0.78;
      quality = Math.max(minQuality, options.quality || 0.64);
    }
  }

  return bestBlob;
}

function setToolPhotoStatus(message = "", tone = "") {

async function prepareGalleryPhoto(file) {
  // Compression is only a transport optimization. Every byte still goes through PHP.
  if (!file.type || !file.type.startsWith("image/")) return { blob: file };
  const sourceUrl = await withTimeout(readFileAsDataURL(file), 10000, "Could not read photo");
  const image = await withTimeout(loadImageFromDataUrl(sourceUrl), 10000, "Could not open photo");
  const blob = await compressImageToJpeg(image, {
    maxDimension: 1050, targetBytes: 240000, quality: 0.7, minQuality: 0.38, attempts: 8
  });
  return { blob: blob || file };
}

async function uploadGalleryPhotoBlob(blob, fileName) {
  if (USE_REMOTE_STORAGE && !authState.config?.uploadsEnabled) throw new Error("Photo uploads are disabled for this tour.");
  if (!USE_REMOTE_STORAGE) throw new Error("Sign in to the hosted tour to share photos.");
  if (!blob) throw new Error("No image was prepared for upload.");
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 18000);
  try {
    const form = new FormData();
    form.append("action", "uploadPhoto");
    form.append("photo", blob, safePhotoFileName(fileName));
    const response = await fetch(`${API_URL}?action=uploadPhoto`, {
      method: "POST",
      body: form,
      credentials: "same-origin",
      headers: { "X-CSRF-Token": authState.csrfToken },
      signal: controller.signal
    });
    if (!response.ok) {
      let message = `Photo upload failed (${response.status})`;
      try {
        const data = await response.json();
        if (data?.error) message = data.error;
      } catch (error) {}
      throw new Error(message);
    }
    const data = await response.json();
    if (typeof data.url !== "string" || !/^\.\/api\.php\?action=privateFile&path=uploads%2Fphotos%2F[a-f0-9]{40}\.jpg$/.test(data.url)) {
      throw new Error("The upload service did not return a processed photo.");
    }
    return data.url;
  } finally {
    clearTimeout(timer);
  }
}

async function handleToolPhotoUpload(event) {
  ensureToolStorage();
  const files = Array.from(event.target.files || []);
  event.target.value = "";
  if (!files.length) return;
  if (!USE_REMOTE_STORAGE) { setToolPhotoStatus("Sign in to the hosted tour to share photos.", "error"); return; }
  if (!authState.config?.uploadsEnabled) { setToolPhotoStatus("Photo uploads are disabled for this tour.", "error"); return; }
  setToolPhotoStatus(`Preparing ${files.length === 1 ? "photo" : "photos"}…`);
  let uploaded = 0;
  let failed = 0;
  let lastError = "";
  for (const file of files) {
    try {
      const id = `photo:${Date.now()}:${Math.random().toString(36).slice(2, 8)}`;
      setToolPhotoStatus(`Processing ${uploaded + failed + 1} of ${files.length}…`);
      const prepared = await prepareGalleryPhoto(file);
      const url = await uploadGalleryPhotoBlob(prepared.blob, file.name);
      // The gallery thumbnail reuses the processed image. No inline copies enter storage.
      const photoRecord = {
        id, name: "Tour photo", url, thumbUrl: url, downloadUrl: url,
        ts: Date.now(), lat: null, lng: null
      };
      await withTimeout(window.storage.set(id, JSON.stringify(photoRecord), true), 20000, "Could not save photo");
      uploaded += 1;
    } catch (error) {
      lastError = error.message || "Photo upload failed.";
      failed += 1;
    }
  }
  await loadToolPhotos();
  if (!failed) {
    setToolPhotoStatus(`${uploaded} ${uploaded === 1 ? "photo has" : "photos have"} been added and shared.`, "success");
  } else {
    setToolPhotoStatus(`${uploaded} shared, ${failed} failed. ${lastError} No local or inline fallback was saved.`, "error");
  }
}
