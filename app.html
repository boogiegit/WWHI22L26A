function formatBytes(bytes) {
  if (!Number.isFinite(bytes) || bytes <= 0) return "0 MB";
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

function crc32(bytes) {
  let c = ~0;
  for (let i = 0; i < bytes.length; i++) {
    c ^= bytes[i];
    for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1));
  }
  return ~c >>> 0;
}

function u16(value) {
  const b = new Uint8Array(2);
  new DataView(b.buffer).setUint16(0, value, true);
  return b;
}

function u32(value) {
  const b = new Uint8Array(4);
  new DataView(b.buffer).setUint32(0, value >>> 0, true);
  return b;
}

async function urlToBytes(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("Photo download failed");
  return new Uint8Array(await response.arrayBuffer());
}

function makeZip(files) {
  const encoder = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  files.forEach((file) => {
    const nameBytes = encoder.encode(file.name);
    const crc = crc32(file.bytes);
    const local = [
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(file.bytes.length), u32(file.bytes.length), u16(nameBytes.length), u16(0), nameBytes, file.bytes
    ];
    const localBlob = new Blob(local);
    chunks.push(localBlob);
    central.push({ nameBytes, crc, size: file.bytes.length, offset });
    offset += localBlob.size;
  });
  const centralStart = offset;
  central.forEach((entry) => {
    const record = [
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(entry.crc), u32(entry.size), u32(entry.size), u16(entry.nameBytes.length), u16(0), u16(0),
      u16(0), u16(0), u32(0), u32(entry.offset), entry.nameBytes
    ];
    const blob = new Blob(record);
    chunks.push(blob);
    offset += blob.size;
  });
  const centralSize = offset - centralStart;
  chunks.push(new Blob([u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(centralSize), u32(centralStart), u16(0)]));
  return new Blob(chunks, { type: "application/zip" });
}

async function downloadAllToolPhotos() {
  ensureToolStorage();
  const keys = (await window.storage.list("photo:", true)).sort().reverse();
  if (!keys.length) {
    setToolPhotoStatus("No group photos to download yet.");
    return;
  }
  setToolPhotoStatus(`Preparing ${keys.length} photos for one ZIP file...`);
  const files = [];
  let skipped = 0;
  for (const key of keys) {
    const raw = await window.storage.get(key, true);
    if (!raw) continue;
    try {
      const item = JSON.parse(raw);
      const url = item.downloadUrl || item.url || item.thumbUrl;
      if (!url) { skipped += 1; continue; }
      files.push({ name: downloadFileNameForPhoto(item), bytes: await urlToBytes(url) });
    } catch (error) {
      skipped += 1;
    }
  }
  if (!files.length) {
    setToolPhotoStatus("No downloadable photos found.", "error");
    return;
  }
  const totalBytes = files.reduce((sum, file) => sum + file.bytes.length, 0);
  const ok = window.confirm(`There are ${files.length} photos about ${formatBytes(totalBytes)}. They will download as one ZIP file. On iPhone or iPad, save it to Files. On Android, save it to Downloads or Files. Continue?`);
  if (!ok) {
    setToolPhotoStatus("Download cancelled.");
    return;
  }
  const zip = makeZip(files);
  const link = document.createElement("a");
  link.href = URL.createObjectURL(zip);
  link.download = `london-to-rome-group-photos-${new Date().toISOString().slice(0, 10)}.zip`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  setToolPhotoStatus(`Created one ZIP with ${files.length} photos (${formatBytes(zip.size)}).${skipped ? ` ${skipped} photo${skipped === 1 ? "" : "s"} could not be included.` : ""}`, "success");
}

async function deleteToolPhoto(id) {
  ensureToolStorage();
  await window.storage.delete(id, true);
  await loadToolPhotos();
  if (activeToolPanel === "photomap") loadPhotoMapTool();
}

async function loadPhotoMapTool() {
  ensureToolStorage();
  const mapEl = document.getElementById("tool-photomap-map");
  const note = document.getElementById("tool-photomap-note");
  if (!mapEl || !note) return;
  const keys = await window.storage.list("photo:", true);
  const items = [];
  for (const key of keys) {
    const raw = await window.storage.get(key, true);
    if (!raw) continue;
    try {
      const item = JSON.parse(raw);
      if (item.lat && item.lng) items.push(item);
    } catch (error) {}
  }
  if (!items.length) {
    note.textContent = "No geotagged photos yet — photos taken with GPS enabled will appear here.";
    mapEl.innerHTML = "";
    return;
  }
  note.textContent = `${items.length} geotagged photo${items.length !== 1 ? "s" : ""} on this map`;
  if (!window.L) return;
  if (!toolPhotoMap) {
    toolPhotoMap = L.map(mapEl, { zoomControl: false }).setView([items[0].lat, items[0].lng], 6);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 19 }).addTo(toolPhotoMap);
    toolPhotoMapLayer = L.layerGroup().addTo(toolPhotoMap);
  }
  toolPhotoMapLayer.clearLayers();
  items.forEach((item) => L.marker([item.lat, item.lng]).addTo(toolPhotoMapLayer).bindPopup(`<strong>${escapeHtml(item.name || "Photo")}</strong>`));
  const group = L.featureGroup(items.map((item) => L.marker([item.lat, item.lng])));
  toolPhotoMap.fitBounds(group.getBounds().pad(0.25));
}

async function loadGroupTool() {
  ensureToolStorage();
  const body = document.getElementById("tool-group-body");
  if (!body) return;
  const mineRaw = await window.storage.get("myprofile", false);
  if (mineRaw) {
    try {
      const mine = JSON.parse(mineRaw);
      document.getElementById("group-name").value = mine.name || "";
      document.getElementById("group-from").value = mine.from || "";
      document.getElementById("group-excited").value = mine.excited || "";
    } catch (error) {}
  }
  const keys = (await window.storage.list("group:", true)).sort();
  const items = [];
  for (const key of keys) {
    const raw = await window.storage.get(key, true);
    if (!raw) continue;
    try { items.push(JSON.parse(raw)); } catch (error) {}
  }
  if (!items.length) {
    body.innerHTML = `<div class="tool-empty">No group introductions yet.</div>`;
    return;
  }
  body.innerHTML = items.map((member) => `<div class="tool-member"><div class="tool-member-body"><div class="tool-title">${escapeHtml(member.name || "Guest")}</div><div class="copy">${escapeHtml(member.from || "")}</div><div class="copy">${escapeHtml(member.excited || "")}</div>${ADMIN_MODE && member.sharedKey ? `<div class="button-row"><button class="button secondary" type="button" onclick="adminDeleteMember('${jsString(member.sharedKey)}')">Remove</button></div>` : ""}</div></div>`).join("");
}

async function submitGroupIntro() {
  ensureToolStorage();
  const name = (document.getElementById("group-name")?.value || "").trim();
  const from = (document.getElementById("group-from")?.value || "").trim();
  const excited = (document.getElementById("group-excited")?.value || "").trim();
  if (!name) return;
  const sharedKeyName = `group:${Date.now()}:${Math.random().toString(36).slice(2, 6)}`;
  const profile = { name, from, excited, ts: Date.now(), sharedKey: sharedKeyName };
  await window.storage.set("myprofile", JSON.stringify(profile), false);
  await window.storage.set(sharedKeyName, JSON.stringify(profile), true);
  await loadGroupTool();
}

async function deleteMyProfile() {
  ensureToolStorage();
  const raw = await window.storage.get("myprofile", false);
  if (raw) {
    try {
      const mine = JSON.parse(raw);
      if (mine.sharedKey) await window.storage.delete(mine.sharedKey, true);
    } catch (error) {}
  }
  await window.storage.delete("myprofile", false);
  await loadGroupTool();
}

async function adminDeleteMember(sharedKeyName) {
  ensureToolStorage();
  await window.storage.delete(sharedKeyName, true);
  await loadGroupTool();
}

function loadQuizTool() {
  quizState = { index: 0, score: 0, questions: [...TOOL_QUIZ_BANK] };
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const body = document.getElementById("tool-quiz-body");
  if (!body) return;
  if (quizState.index >= quizState.questions.length) {
    body.innerHTML = `<div class="tool-card"><div class="tool-body"><div class="brief-hdr">Complete</div><div class="brief-lead">${quizState.score} / ${quizState.questions.length}</div><div class="copy">A quick Europe-themed score for this route.</div><div class="button-row"><button class="button primary" type="button" onclick="loadQuizTool()">Play again</button></div></div></div>`;
    return;
  }
  const question = quizState.questions[quizState.index];
  body.innerHTML = `<div class="tool-card"><div class="tool-body"><div class="brief-hdr">Question ${quizState.index + 1} / ${quizState.questions.length}</div><div class="brief-lead">${escapeHtml(question.q)}</div><div class="tool-stack" style="margin-top:14px">${question.answers.map((answer) => `<button class="button secondary" type="button" onclick="answerQuizQuestion('${jsString(answer)}')">${escapeHtml(answer)}</button>`).join("")}</div></div></div>`;
}

function answerQuizQuestion(answer) {
  const question = quizState.questions[quizState.index];
  if (answer === question.correct) quizState.score += 1;
  quizState.index += 1;
  renderQuizQuestion();
}

function buildMemoryTool() {
  const body = document.getElementById("tool-memory-body");
  if (!body) return;
  const currentDay = displayDayNumber();
  const completed = tour.days.filter((day) => day.number <= currentDay);
  body.innerHTML = `
    <div class="tool-stat-grid">
      <div class="tool-stat"><strong>${completed.length}</strong><span>Days completed</span></div>
      <div class="tool-stat"><strong>${new Set(completed.map((day) => hotelForDay(day)?.city || currentCity(day)).filter(Boolean)).size}</strong><span>Overnight stops</span></div>
    </div>
    <div class="tool-simple-list">${completed.map((day) => `<div class="tool-route-item"><div class="tool-route-body"><div class="tool-meta"><span class="pill">Day ${day.number}</span><span class="pill">${escapeHtml(dateShort(day.date))}</span></div><div class="tool-title">${escapeHtml(day.guest.title || day.technical.routeTitle)}</div><div class="copy">${escapeHtml((day.schedule || []).slice(0, 4).map((item) => `${item.time || 'TBC'} · ${item.title}`).join(' · '))}</div></div></div>`).join("")}</div>`;
}
